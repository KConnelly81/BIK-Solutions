definitions:
  # Shared step: regenerate mobile/www/js/shared/ from ../js/ and sync
  # Capacitor's native projects with the current www/ before every build.
  # Never skip this — a build without it ships whatever was last committed
  # to mobile/www/js/shared/, which (per mobile/.gitignore) is nothing,
  # since that directory is a build artifact, not checked in.
  #
  # Runs with working_directory: mobile already set on every workflow
  # below, so paths here are relative to mobile/, not the repo root.
  sync_step: &sync_step
    name: Install deps and sync Capacitor
    script: |
      npm ci
      npm run sync

workflows:
  # ── 1. Unsigned Android build ──────────────────────────────────────────
  # Produces a debug-signed (not release-signed) APK any team member can
  # install to a test device without needing Play Console access or a
  # release keystore — exists specifically so Android builds can be
  # verified before Google Play credentials exist. See workflow 3 below
  # for adding a real release keystore later.
  android-unsigned:
    name: Android — unsigned debug build
    max_build_duration: 30
    instance_type: linux_x2
    working_directory: mobile
    environment:
      node: 20
      java: 17
      groups: []  # no secrets needed for this workflow — deliberately
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: 'claude/mobile-*'
          include: true
        - pattern: 'main'
          include: false
    scripts:
      - *sync_step
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk

  # ── 2. Unsigned iOS / simulator build ───────────────────────────────────
  # Builds for the iOS Simulator — no code signing, no Apple Developer
  # account, no provisioning profile needed. This is what "detect build/
  # configuration problems before Apple credentials exist" means in
  # practice: a real Xcode build that would catch a broken CocoaPods
  # install, a bad Info.plist key, or a plugin incompatibility, without
  # needing anything from Apple. It does NOT produce an .ipa installable
  # on a real device or the App Store — see the signed workflow below for
  # that, once credentials exist.
  ios-unsigned-simulator:
    name: iOS — unsigned simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups: []
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: 'claude/mobile-*'
          include: true
        - pattern: 'main'
          include: false
    scripts:
      - *sync_step
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Build for iOS Simulator (no signing)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build
    artifacts:
      - mobile/ios/App/build/Build/Products/Debug-iphonesimulator/*.app

  # ── 3. Signed release build — NOT active until credentials exist ───────
  # Left here, disabled, as the deliberate next step: once an Apple
  # Developer Program account, a distribution certificate + provisioning
  # profile, a Google Play release keystore, and Play Console API access
  # exist, this workflow becomes the one that produces a real .ipa/.aab
  # for TestFlight/Play internal testing — see
  # /mobile-release/RELEASE_CHECKLIST.md for the exact credentials list
  # and where each one plugs in below. Nothing about the pipeline
  # STRUCTURE changes when that happens — only `groups` gains real
  # Codemagic environment-variable groups (ios_signing, android_signing,
  # app_store_connect, google_play), and the two commented blocks below
  # are un-commented. The android-unsigned/ios-unsigned-simulator
  # workflows above are unaffected either way and should keep running on
  # every push regardless.
  #
  # release-signed:
  #   name: Release — signed builds for App Store / Play Store
  #   max_build_duration: 60
  #   instance_type: mac_mini_m2
  #   working_directory: mobile
  #   environment:
  #     node: 20
  #     xcode: latest
  #     cocoapods: default
  #     groups:
  #       - ios_signing            # ASC_API_KEY, ASC_KEY_ID, ASC_ISSUER_ID, CERTIFICATE_PRIVATE_KEY
  #       - android_signing        # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
  #     ios_signing:
  #       distribution_type: app_store
  #       bundle_identifier: au.com.biksolutions.field   # placeholder — confirm before first submission
  #   triggering:
  #     events: [tag]
  #     tag_patterns:
  #       - pattern: 'mobile-v*'
  #         include: true
  #   scripts:
  #     - *sync_step
  #     - name: iOS — install pods, build, sign, export .ipa
  #       script: |
  #         cd ios/App
  #         pod install
  #         xcode-project use-profiles
  #         xcode-project build-ipa --workspace App.xcworkspace --scheme App
