<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Set a new password for your BIK Solutions account." />
  <meta name="robots" content="noindex" />
  <title>Reset password — BIK Solutions</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/supabase-app.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card" id="auth-card" hidden>
      <a class="auth-logo" href="index.html" aria-label="BIK Solutions — home">
        <div class="logo-mark" aria-hidden="true">B</div>
        <div>
          <div class="auth-logo-name">BIK Solutions</div>
          <div class="auth-logo-tag">Beyond Industry Knowledge</div>
        </div>
      </a>

      <h1 class="auth-title">Set a new password</h1>
      <p class="auth-subtitle" id="auth-subtitle">Choose a new password for your account.</p>

      <div class="banner banner--error" id="error-banner" hidden role="alert"></div>
      <div class="banner banner--success" id="success-banner" hidden role="status"></div>

      <form class="auth-form" id="reset-form">
        <div class="form-row">
          <div class="form-group">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" minlength="8" required />
          </div>
        </div>
        <p class="field-hint">At least 8 characters.</p>

        <button type="submit" class="btn btn--coral" id="submit-btn">Set new password</button>
      </form>

      <p class="auth-footer" id="auth-footer"><a href="signin.html">Back to sign in</a></p>
    </div>
  </div>

  <script src="js/vendor/supabase-js.min.js"></script>
  <script type="module">
    import { supabase } from './js/supabase/client.js';
    import { friendlyAuthError } from './js/supabase/session.js';

    const card = document.getElementById('auth-card');
    const subtitle = document.getElementById('auth-subtitle');
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBanner = document.getElementById('error-banner');
    const successBanner = document.getElementById('success-banner');

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.hidden = false;
      successBanner.hidden = true;
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.dataset.loading = String(loading);
      submitBtn.textContent = loading ? 'Saving…' : 'Set new password';
    }

    function showInvalidLinkState() {
      form.hidden = true;
      subtitle.textContent = 'This password reset link is invalid or has expired.';
      showError('Request a new reset link from the forgot password page.');
    }

    // The reset-password email link lands here with a recovery token in
    // the URL, which the Supabase client (detectSessionInUrl: true, set
    // in js/supabase/client.js) parses automatically on load, firing a
    // PASSWORD_RECOVERY auth event once a session is established from it.
    // Listening for that event, rather than just calling getSession()
    // once, avoids a race against that async detection step.
    let settled = false;
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' && !settled) {
        settled = true;
        card.hidden = false;
      }
    });

    // Fallback: if a session already exists by the time this runs (the
    // event fired before the listener was attached, which can happen on
    // a fast reload of this same page), show the form instead of waiting
    // for an event that already passed. If neither this nor the event
    // above fires within a few seconds, the link was invalid/expired.
    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data.session && !settled) {
        settled = true;
        card.hidden = false;
      }
    })();

    setTimeout(() => {
      if (!settled) {
        settled = true;
        card.hidden = false;
        showInvalidLinkState();
      }
    }, 4000);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBanner.hidden = true;

      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;

      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      setLoading(true);
      try {
        const { error } = await supabase.auth.updateUser({ password });

        if (error) {
          showError(friendlyAuthError(error));
          return;
        }

        // updateUser succeeding during a recovery session leaves the
        // user signed in with a valid session under the new password —
        // no need to make them sign in again.
        window.location.href = 'app-dashboard.html';
      } catch (err) {
        showError(friendlyAuthError(err));
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
