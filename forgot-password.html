<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your BIK Solutions password." />
  <meta name="robots" content="noindex" />
  <title>Forgot password — BIK Solutions</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/supabase-app.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card" id="auth-card" hidden>
      <a class="auth-logo" href="index.html" aria-label="BIK Solutions — home">
        <div class="logo-mark" aria-hidden="true">B</div>
        <div>
          <div class="auth-logo-name">BIK Solutions</div>
          <div class="auth-logo-tag">Beyond Industry Knowledge</div>
        </div>
      </a>

      <h1 class="auth-title">Forgot your password?</h1>
      <p class="auth-subtitle">Enter your email and we’ll send you a link to reset it.</p>

      <div class="banner banner--error" id="error-banner" hidden role="alert"></div>
      <div class="banner banner--success" id="success-banner" hidden role="status"></div>

      <form class="auth-form" id="forgot-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <button type="submit" class="btn btn--coral" id="submit-btn">Send reset link</button>
      </form>

      <p class="auth-footer">Remembered your password? <a href="signin.html">Sign in</a></p>
    </div>
  </div>

  <script src="js/vendor/supabase-js.min.js"></script>
  <script type="module">
    import { supabase } from './js/supabase/client.js';
    import { redirectIfSignedIn, friendlyAuthError } from './js/supabase/session.js';

    const card = document.getElementById('auth-card');
    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBanner = document.getElementById('error-banner');
    const successBanner = document.getElementById('success-banner');

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.hidden = false;
      successBanner.hidden = true;
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.dataset.loading = String(loading);
      submitBtn.textContent = loading ? 'Sending…' : 'Send reset link';
    }

    (async () => {
      const alreadySignedIn = await redirectIfSignedIn('app-dashboard.html');
      if (!alreadySignedIn) card.hidden = false;
    })();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBanner.hidden = true;

      const email = form.email.value.trim();

      setLoading(true);
      try {
        // Derived from window.location.origin, same reasoning as
        // signup.html's emailRedirectTo — never resolves to localhost or
        // a hard-coded domain. Must match an allowed redirect URL
        // configured in Supabase Auth -> URL Configuration.
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: `${window.location.origin}/reset-password.html`
        });

        if (error) {
          showError(friendlyAuthError(error));
          return;
        }

        // Supabase does not reveal whether the email is registered —
        // same account-enumeration protection as the sign-up flow —
        // so this message is shown regardless of whether the account
        // exists.
        form.hidden = true;
        successBanner.textContent =
          'If an account exists for that email, a reset link is on its way. Check your inbox.';
        successBanner.hidden = false;
      } catch (err) {
        showError(friendlyAuthError(err));
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
