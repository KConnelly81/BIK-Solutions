<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=app-dashboard.html" />
  <title>Redirecting… — BIK Business Toolkit</title>
  <link rel="stylesheet" href="css/bik-design-system.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .redirect-box p { margin: 0 0 16px; color: var(--bik-text-secondary); }
  </style>
  <script>
    // This page (the old, disconnected localStorage-only toolkit dashboard)
    // is retired — see docs/changelog.md's "Legacy dashboard.html retired"
    // entry. It is kept as a redirect, not deleted, so old bookmarks and
    // any stale inbound links still land somewhere real rather than 404ing.
    // JS redirect fires first (no flash of retired content); the
    // <meta http-equiv="refresh"> above is the no-JS fallback.
    location.replace('app-dashboard.html');
  </script>
</head>
<body>
  <div class="redirect-box">
    <p>Taking you to your dashboard…</p>
    <a class="btn btn--coral" href="app-dashboard.html">Continue to dashboard</a>
  </div>
</body>
</html>
